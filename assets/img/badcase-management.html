<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badcase 管理 - vLLM 可观测平台</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #181b24;
            --surface2: #1e2130;
            --border: #2a2d3a;
            --text: #e1e4ea;
            --text2: #8b8fa7;
            --accent: #6c8cff;
            --green: #4ade80;
            --red: #f87171;
            --yellow: #fbbf24;
            --orange: #fb923c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 0; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-logo { padding: 0 20px 20px; font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: 0.5px; }
        .sidebar-nav { flex: 1; }
        .nav-item { padding: 10px 20px; display: flex; align-items: center; gap: 10px; color: var(--text2); cursor: pointer; font-size: 13px; transition: all 0.15s; }
        .nav-item:hover { color: var(--text); background: var(--surface2); }
        .nav-item.active { color: var(--accent); background: var(--surface2); border-right: 2px solid var(--accent); }
        .nav-icon { width: 18px; text-align: center; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top bar */
        .topbar { height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; flex-shrink: 0; }
        .topbar-title { font-size: 15px; font-weight: 600; }
        .topbar-run { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        .tb-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
        .badge-pass { background: rgba(74,222,128,0.12); color: var(--green); }
        .badge-fail { background: rgba(248,113,113,0.12); color: var(--red); }

        /* Content area */
        .content { flex: 1; display: flex; overflow: hidden; }
        
        /* Left panel - list */
        .panel-left { width: 420px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        .panel-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .panel-header .tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: 8px; padding: 3px; }
        .panel-header .tab { padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text2); transition: all 0.15s; }
        .panel-header .tab.active { background: var(--bg); color: var(--text); font-weight: 600; }
        .search-box { flex: 1; margin-left: 8px; }
        .search-box input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; color: var(--text); font-size: 12px; }
        
        /* Sample list */
        .sample-list { flex: 1; overflow-y: auto; }
        .sample-row { padding: 12px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.12s; display: flex; align-items: flex-start; gap: 10px; }
        .sample-row:hover { background: var(--surface2); }
        .sample-row.active { background: var(--surface2); border-left: 3px solid var(--accent); }
        .sample-score { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
        .sample-score.pass { background: rgba(74,222,128,0.15); color: var(--green); }
        .sample-score.fail { background: rgba(248,113,113,0.15); color: var(--red); }
        .sample-info { flex: 1; min-width: 0; }
        .sample-id { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
        .sample-meta { font-size: 11px; color: var(--text2); display: flex; gap: 12px; }
        .sample-cat { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--surface2); color: var(--text2); }
        .sample-preview { font-size: 11px; color: var(--text2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
        .sample-trace { font-size: 10px; color: var(--accent); margin-top: 2px; }

        /* Right panel - detail */
        .panel-right { flex: 1; overflow-y: auto; padding: 24px; }
        .detail-header { margin-bottom: 20px; }
        .detail-header h3 { font-size: 16px; margin-bottom: 6px; }
        .detail-meta { font-size: 12px; color: var(--text2); display: flex; gap: 20px; }
        .detail-section { margin-bottom: 20px; }
        .detail-section h4 { font-size: 12px; text-transform: uppercase; color: var(--text2); letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 600; }
        .code-block { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 12px; line-height: 1.6; font-family: "JetBrains Mono", "Fira Code", monospace; white-space: pre-wrap; word-break: break-word; }
        .code-block.diff { border-left: 3px solid var(--red); }
        .code-block.pass { border-left: 3px solid var(--green); }

        /* Trace info card */
        .trace-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; gap: 20px; flex-wrap: wrap; }
        .trace-metric { text-align: center; }
        .trace-metric .val { font-size: 18px; font-weight: 700; color: var(--accent); }
        .trace-metric .label { font-size: 10px; color: var(--text2); margin-top: 2px; }
        .trace-link { font-size: 12px; color: var(--accent); cursor: pointer; margin-top: 10px; display: block; }

        /* Agent trajectory timeline */
        .timeline { position: relative; padding-left: 24px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--border); }
        .tl-step { position: relative; margin-bottom: 16px; }
        .tl-step::before { content: ''; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: 2px solid var(--surface2); }
        .tl-step.llm::before { background: var(--accent); }
        .tl-step.tool::before { background: var(--orange); }
        .tl-step.obs::before { background: var(--yellow); }
        .tl-step.error::before { background: var(--red); }
        .tl-step .tl-type { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .tl-step.llm .tl-type { color: var(--accent); }
        .tl-step.tool .tl-type { color: var(--orange); }
        .tl-step.obs .tl-type { color: var(--yellow); }
        .tl-step.error .tl-type { color: var(--red); }
        .tl-step .tl-time { font-size: 10px; color: var(--text2); margin-left: 6px; }
        .tl-content { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; font-size: 11px; line-height: 1.5; }
        .tl-content summary { cursor: pointer; font-weight: 600; font-size: 11px; }
        .tl-content .io { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
        .tl-content .io-label { font-size: 10px; color: var(--text2); margin-bottom: 3px; }
        .tl-content .io-val { font-size: 10px; font-family: "JetBrains Mono", "Fira Code", monospace; color: var(--text2); word-break: break-all; }

        /* Classification clusters */
        .cluster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 14px; }
        .cluster-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.15s; }
        .cluster-card:hover { border-color: var(--accent); }
        .cluster-card.active { border-color: var(--accent); background: rgba(108,140,255,0.05); }
        .cluster-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .cluster-count { font-size: 11px; color: var(--text2); margin-bottom: 8px; }
        .cluster-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
        .cluster-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
        .cluster-snippet { font-size: 10px; color: var(--text2); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Status dots */
        .link-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .link-dot.on { background: var(--green); }
        .link-dot.off { background: var(--text2); }

        /* Pagination */
        .pagination { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text2); flex-shrink: 0; }
        .pagination .page-btn { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: var(--surface2); color: var(--text2); font-size: 11px; }
        .pagination .page-btn:hover { color: var(--text); border-color: var(--accent); }
        .pagination .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .page-btns { display: flex; gap: 4px; }
    </style>
</head>
<body>

        <div class="sidebar-logo">⚡ vLLM Observatory</div>

            </div>

            <!-- Right: detail view -->
            <div class="panel-right" id="detailPanel">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

            ]
        }
    };

    let currentRun = 'mmlu-20260805-vllm-0.6.1';
    let currentSample = null;

    // ======================== RENDER ========================
    function renderPage() {
        const run = runs[currentRun];
        // update topbar
        document.getElementById('accuracyBadge').textContent = 'accuracy ' + run.accuracy;
        document.getElementById('accuracyBadge').className = 'badge ' + run.accuracyClass;
        document.getElementById('totalBadge').textContent = run.samples.length;
        document.getElementById('pageInfo').textContent = '第 1/1 页，共 ' + run.samples.length + ' 条';

        // pick first sample as active
        if (!currentSample || !run.samples.find(s => s.id === currentSample.id)) {
            currentSample = run.samples[0];
        }

        // render sample list
        const list = document.getElementById('sampleList');
        list.innerHTML = run.samples.map(s => {
            const active = currentSample.id === s.id ? ' active' : '';
            const traceHtml = s.traceOn 
                ? '<span class="link-dot on"></span>vLLM trace 已关联' + (s.trace.includes('×') ? ' (' + s.trace.split('×')[1] + ' steps)' : '') 
                : '<span class="link-dot off"></span>vLLM 数据不可用' + (s.id.includes('cs') || s.id.includes('gsm8k_0456') || s.id.includes('swe_task_0311') ? '（已过期）' : '');
            const scoreClass = s.score === 0 ? 'fail' : 'pass';
            const scoreSymbol = s.score === 0 ? '✗' : '✓';
            return `<div class="sample-row${active}" onclick="selectSample('${s.id}')">
                <div class="sample-score ${scoreClass}">${scoreSymbol}</div>
                <div class="sample-info">
                    <div class="sample-id">${s.id}</div>
                    <div class="sample-meta"><span class="sample-cat" style="color:${s.catColor}">${s.cat}</span><span>Trace: ${s.trace || '—'}</span></div>
                    <div class="sample-preview">${s.preview}</div>
                    <div class="sample-trace">${traceHtml}</div>
                </div>
            </div>`;
        }).join('');

        // render detail panel
        renderDetail(currentSample);
    }

    function renderDetail(s) {
        const panel = document.getElementById('detailPanel');

        let traceSection = '';
        if (s.metrics) {
            traceSection = `
            <div class="detail-section">
                <h4>🔗 关联的 vLLM Trace 指标</h4>
                <div class="trace-card">
                    <div class="trace-metric"><div class="val">${s.metrics.ttft}</div><div class="label">TTFT</div></div>
                    <div class="trace-metric"><div class="val"${s.metrics.kvCacheBad ? ' style="color:var(--red)"' : ''}>${s.metrics.kvCache}</div><div class="label">KV Cache Hit</div></div>
                    <div class="trace-metric"><div class="val"${s.metrics.preemptionsBad ? ' style="color:var(--red)"' : ''}>${s.metrics.preemptions}</div><div class="label">Preemptions</div></div>
                    <div class="trace-metric"><div class="val">${s.metrics.decode}</div><div class="label">Decode Duration</div></div>
                    <div class="trace-metric"><div class="val">${s.metrics.tokens}</div><div class="label">Output Tokens</div></div>
                </div>
                <a class="trace-link">→ 在 Jaeger 中查看完整 Trace</a>
            </div>`;
        } else {
            traceSection = `
            <div class="detail-section">
                <h4>🔗 关联的 vLLM Trace 指标</h4>
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text2);font-size:12px;">
                    ⚠ 该 sample 的 vLLM 数据不可用（评测时 Prometheus/Jaeger 数据已过期）。<br>
                    原始数据浏览不受影响，但归因分析不可用。
                </div>
            </div>`;
        }

        // Agent trajectory hint
        let trajectoryHint = '';
        if (s.trajectory) {
            trajectoryHint = `
            <div class="detail-section">
                <h4>🤖 Agent Trajectory 概览</h4>
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;">
                    <div style="display:flex;gap:24px;flex-wrap:wrap;font-size:12px;">
                        <div><span style="color:var(--accent);font-weight:700;">${s.trace.split('×')[1] || 'N/A'}</span> <span style="color:var(--text2);">Steps</span></div>
                        <div><span style="color:var(--orange);font-weight:700;">${Math.floor(Math.random()*3)+2}</span> <span style="color:var(--text2);">Tools Called</span></div>
                        <div><span style="color:var(--yellow);font-weight:700;">${(Math.random()*8+2).toFixed(1)}s</span> <span style="color:var(--text2);">Total Latency</span></div>
                        <div><span style="color:var(--red);font-weight:700;">${Math.floor(Math.random()*3)+1}</span> <span style="color:var(--text2);">Redundant Steps</span></div>
                    </div>
                    <div style="margin-top:10px;font-size:10px;color:var(--text2);">点击 <a style="color:var(--accent);cursor:pointer;">展开完整 Trajectory 时间线</a>（Langfuse 风格 step-by-step 视图）</div>
                </div>
            </div>`;
        }

        panel.innerHTML = `
            <div class="detail-header">
                <h3>${s.id}</h3>
                <div class="detail-meta">
                    <span>📂 ${s.cat} / ${currentRun.split('-')[0]}</span>
                    <span>🔗 trace: ${s.traceOn ? '<span style="color:var(--accent)">' + s.trace + '</span>' : '<span style="color:var(--text2)">—</span>'}</span>
                    <span><span class="badge badge-fail">score: ${s.score}</span></span>
                </div>
            </div>
            <div class="detail-section">
                <h4>📝 Prompt</h4>
                <div class="code-block">${escapeHtml(s.prompt)}</div>
            </div>
            <div class="detail-section">
                <h4>❌ Prediction</h4>
                <div class="code-block diff">${escapeHtml(s.prediction)}</div>
            </div>
            <div class="detail-section">
                <h4>✅ Ground Truth</h4>
                <div class="code-block pass">${escapeHtml(s.groundTruth)}</div>
            </div>
            <div style="font-size:11px; color:var(--yellow); margin-bottom:20px;">${s.matchNote}</div>
            ${trajectoryHint}
            ${traceSection}
            <div class="detail-section">
                <h4>📊 所属分类</h4>
                <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;">
                    <span style="font-size:13px;font-weight:600;">${s.cluster.name}</span>
                    <span style="font-size:11px;color:var(--text2);margin-left:8px;">${s.cluster.count} cases</span>
                    <div style="font-size:11px;color:var(--text2);margin-top:6px;">${s.cluster.desc}</div>
                </div>
            </div>
        `;
    }

    function selectSample(id) {
        const run = runs[currentRun];
        currentSample = run.samples.find(s => s.id === id);
        renderPage();
    }

    // ======================== EVENTS ========================
    document.getElementById('runSelect').addEventListener('change', function(e) {
        currentRun = e.target.value;
        currentSample = null;
        renderPage();
    });

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', 
            (tab === 'all' && i === 0) || (tab === 'cluster' && i === 1) || (tab === 'agent' && i === 2)
        ));
    }

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ======================== INIT ========================
    renderPage();
    </script>
</body>
</html>
